function cmd(i){var b=D[i][3]();return b.charAt(0)=="/"?b.split("%N").join(NICK):"/minecraft:give @a[name="+NICK+"] "+b}
var cur=-1,qs="";
function flash(b,t){var o=b.textContent;b.textContent=t;b.classList.add("ok");setTimeout(function(){b.textContent=o;b.classList.remove("ok")},1400)}
function copy(t,b){
function fb(){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");flash(b,"Скопировано ✓")}catch(e){flash(b,"Ошибка")}a.remove()}
try{navigator.clipboard.writeText(t).then(function(){flash(b,"Скопировано ✓")},fb)}catch(e){fb()}}
function render(){
var L=document.getElementById("list");L.innerHTML="";var n=0;
CATS.forEach(function(c,ci){
if(cur>=0&&cur!==ci)return;
var idx=[];D.forEach(function(d,i){if(d[0]===ci&&d[1].toLowerCase().indexOf(qs)>-1)idx.push(i)});
if(!idx.length)return;n+=idx.length;
var s=document.createElement("div");s.className="sec";
s.innerHTML="<h2>"+c[1]+" "+c[0]+" ("+idx.length+")</h2>";
var all=document.createElement("button");all.className="btn s";all.textContent="Копировать все";
all.onclick=function(){copy(idx.map(cmd).join("\n"),all)};
s.appendChild(all);L.appendChild(s);
idx.forEach(function(i){
var k=document.createElement("div");k.className="card";
var h=document.createElement("h3");h.textContent=D[i][1];
var p=document.createElement("p");p.textContent=D[i][2];
var pre=document.createElement("pre");var cm=cmd(i);pre.textContent=cm;
var b=document.createElement("button");b.className="btn";b.textContent="Копировать";
b.onclick=function(){copy(cm,b)};
k.appendChild(h);k.appendChild(p);k.appendChild(pre);k.appendChild(b);L.appendChild(k)})});
if(!n)L.innerHTML='<div class="empty">Ничего не найдено</div>'}
var T=document.getElementById("tabs");
[["Все","",-1]].concat(CATS.map(function(c,i){return [c[0],c[1],i]})).forEach(function(t){
var b=document.createElement("button");b.className="tab"+(t[2]===-1?" on":"");b.textContent=(t[1]?t[1]+" ":"")+t[0];
b.onclick=function(){cur=t[2];[].forEach.call(T.children,function(x){x.classList.remove("on")});b.classList.add("on");render()};
T.appendChild(b)});
document.getElementById("q").oninput=function(){qs=this.value.toLowerCase().trim();render()};
document.getElementById("nick").oninput=function(){NICK=this.value.trim()||"fdvh_7th7";render()};
render();
</script>
